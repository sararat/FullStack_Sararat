services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hrsystem_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrsystem_backend
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: hrsystem_mysql

    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: hrsystem

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hrsystem_phpmyadmin

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8080:80"

    depends_on:
      - mysql


volumes:
  mysql_data: